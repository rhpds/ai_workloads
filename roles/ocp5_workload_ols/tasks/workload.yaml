---
- name: Validate OLS provider
  ansible.builtin.assert:
    that:
      - ocp5_workload_ols_provider in ['maas', 'azure_sp', 'azure_token', 'openai']
    fail_msg: >-
      ocp5_workload_ols_provider must be one of: maas, azure_sp, azure_token, openai

- name: Validate MaaS variables
  when: ocp5_workload_ols_provider == 'maas'
  ansible.builtin.assert:
    that:
      - ocp5_workload_ols_maas_api_token is defined
      - ocp5_workload_ols_maas_api_token != "changeme"
      - ocp5_workload_ols_maas_api_token | length > 0
    fail_msg: >-
      MaaS is selected but ocp5_workload_ols_maas_api_token is not configured.

- name: Validate Azure service principal variables
  when: ocp5_workload_ols_provider == 'azure_sp'
  ansible.builtin.assert:
    that:
      - ocp5_workload_ols_azure_tenant_id is defined
      - ocp5_workload_ols_azure_tenant_id != "changeme"
      - ocp5_workload_ols_main_client_id is defined
      - ocp5_workload_ols_main_client_id != "changeme"
      - ocp5_workload_ols_main_client_secret is defined
      - ocp5_workload_ols_main_client_secret != "changeme"
      - ocp5_workload_ols_azure_group_id is defined
      - ocp5_workload_ols_azure_group_id != "changeme"
      - ocp5_workload_ols_child_app_display_name is defined
      - guid is defined
    fail_msg: >-
      Azure SP is selected but required Azure AD variables are not configured.

- name: Validate Azure API token variables
  when: ocp5_workload_ols_provider == 'azure_token'
  ansible.builtin.assert:
    that:
      - ocp5_workload_ols_azure_api_token is defined
      - ocp5_workload_ols_azure_api_token != "changeme"
      - ocp5_workload_ols_azure_api_token | length > 0
    fail_msg: >-
      Azure token is selected but ocp5_workload_ols_azure_api_token is not configured.

- name: Validate OpenAI variables
  when: ocp5_workload_ols_provider == 'openai'
  ansible.builtin.assert:
    that:
      - ocp5_workload_ols_openai_api_key is defined
      - ocp5_workload_ols_openai_api_key != "changeme"
      - ocp5_workload_ols_openai_api_key | length > 0
    fail_msg: >-
      OpenAI is selected but ocp5_workload_ols_openai_api_key is not configured.

# Ensure that the openshift-lightspeed namespace is always created
- name: Ensure openshift-lightspeed namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: openshift-lightspeed
    state: present

# Install the OLS Operator
- name: Install OLS Operator
  when: ocp5_workload_ols_install_operator | bool
  ansible.builtin.include_tasks: install_ols_operator.yaml

# Configure OLS
- name: Configure OLS
  block:
    - name: Setup Azure child app and service principal
      when: ocp5_workload_ols_provider == 'azure_sp'
      ansible.builtin.include_tasks: setup_azure_token.yaml

    - name: Create MaaS secret
      when: ocp5_workload_ols_provider == 'maas'
      kubernetes.core.k8s:
        template: create_maas_secret.yaml.j2
        wait: true
        wait_timeout: 300

    - name: Create Azure API token secret
      when: ocp5_workload_ols_provider == 'azure_token'
      kubernetes.core.k8s:
        template: create_azure_token_secret.yaml.j2
        wait: true
        wait_timeout: 300

    - name: Create Azure service principal secret
      when: ocp5_workload_ols_provider == 'azure_sp'
      kubernetes.core.k8s:
        template: create_azure_sp_secret.yaml.j2
        wait: true
        wait_timeout: 300

    - name: Create OpenAI secret
      when: ocp5_workload_ols_provider == 'openai'
      kubernetes.core.k8s:
        template: create_openai_secret.yaml.j2
        wait: true
        wait_timeout: 300

    - name: Create OLSConfig
      kubernetes.core.k8s:
        template: "{{ _ocp5_workload_ols_olsconfig_templates[ocp5_workload_ols_provider] }}"
        wait: true
        wait_timeout: 300
      vars:
        _ocp5_workload_ols_olsconfig_templates:
          maas: install_maas_olsconfig.yaml.j2
          azure_sp: install_azure_sp_olsconfig.yaml.j2
          azure_token: install_azure_token_olsconfig.yaml.j2
          openai: install_openai_olsconfig.yaml.j2

# Build the list of non-admin users to grant lightspeed-operator-query-access.
# Strategy depends on the auth provider:
#   htpasswd → parse the htpasswd secret in openshift-config (authoritative source)
#   keycloak → read the KeycloakRealmImport CR (no REST API or token needed)

- name: Initialize user grant list
  ansible.builtin.set_fact:
    _ocp5_workload_ols_grant_users: []

# htpasswd: the secret is the single source of truth for all configured usernames
- name: Discover users from htpasswd secret
  when: ocp5_workload_ols_auth_provider == 'htpasswd'
  block:
    - name: Get htpasswd secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "{{ ocp5_workload_ols_htpasswd_secret_name }}"
        namespace: openshift-config
      register: r_htpasswd_secret

    - name: Build user list from htpasswd secret
      ansible.builtin.set_fact:
        _ocp5_workload_ols_grant_users: >-
          {{
            r_htpasswd_secret.resources[0].data.htpasswd
            | b64decode
            | regex_findall('(?m)^([^:]+):')
            | reject('equalto', ocp5_workload_ols_admin_username)
            | list
          }}

# keycloak: read the KeycloakRealmImport CR directly — no REST API or token needed
- name: Discover users from KeycloakRealmImport CR
  when: ocp5_workload_ols_auth_provider == 'keycloak'
  block:
    - name: Get KeycloakRealmImport CR
      kubernetes.core.k8s_info:
        api_version: k8s.keycloak.org/v2alpha1
        kind: KeycloakRealmImport
        name: "{{ ocp5_workload_ols_keycloak_realm }}"
        namespace: "{{ ocp5_workload_ols_keycloak_namespace }}"
      register: r_keycloak_realm_import

    - name: Build user list from KeycloakRealmImport
      ansible.builtin.set_fact:
        _ocp5_workload_ols_grant_users: >-
          {{
            r_keycloak_realm_import.resources[0].spec.realm.users
            | map(attribute='username')
            | reject('equalto', ocp5_workload_ols_admin_username)
            | list
          }}

- name: Grant lightspeed-operator-query-access to non-admin users
  when: _ocp5_workload_ols_grant_users | length > 0
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: "lightspeed-operator-query-access-{{ item }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: lightspeed-operator-query-access
      subjects:
        - apiGroup: rbac.authorization.k8s.io
          kind: User
          name: "{{ item }}"
  loop: "{{ _ocp5_workload_ols_grant_users }}"

# Deploy agentic OLS on top of classic OLS (optional, gated by feature flag)
- name: Deploy Agentic OLS
  when: ocp5_workload_ols_enable_agentic | bool
  ansible.builtin.include_tasks: deploy_agentic_ols.yaml
