---
# ================================
# Agentic OLS configuration
# The OLS operator bundle (redhat-operators) already deployed the agentic
# controller, CRDs, OTEL collector, Postgres, console plugin and the alerts
# adapter RBAC. This file only adds what the operator does not provide:
# reader/execution RBAC, LLM credentials, LLMProvider/Agent/ApprovalPolicy
# CRs and the alerts-adapter-config ConfigMap (referenced from the
# OLSConfig via spec.ols.deployment.alertsAdapter.configMapRef).
# Classic OLS continues using its own provider credentials; the agentic
# component uses an independent API key (ocp5_workload_ols_agentic_api_key).
# ================================

- name: Assert agentic API key is configured
  ansible.builtin.assert:
    that:
      - ocp5_workload_ols_agentic_api_key is defined
      - ocp5_workload_ols_agentic_api_key != "changeme"
      - ocp5_workload_ols_agentic_api_key | length > 0
    fail_msg: >-
      ocp5_workload_ols_agentic_api_key must be set to a real API key (OpenAI key or MaaS token)
      when ocp5_workload_ols_enable_agentic is true.

- name: Resolve effective agentic settings
  ansible.builtin.set_fact:
    _ocp5_workload_ols_agentic_effective_model: >-
      {{ ocp5_workload_ols_agentic_maas_model
         if ocp5_workload_ols_agentic_provider == 'maas'
         else ocp5_workload_ols_agentic_model }}
    _ocp5_workload_ols_agentic_effective_creds_secret: >-
      {{ 'llm-creds-maas'
         if ocp5_workload_ols_agentic_provider == 'maas'
         else 'llm-creds-openai' }}

- name: Wait for the agentic operator controller to be available
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: lightspeed-agentic-operator-controller-manager
    namespace: "{{ ocp5_workload_ols_namespace }}"
  register: r_agentic_controller
  until:
    - r_agentic_controller.resources | length > 0
    - r_agentic_controller.resources[0].status.availableReplicas is defined
    - r_agentic_controller.resources[0].status.availableReplicas >= 1
  retries: 60
  delay: 20

# --------------------------------
# Reader RBAC for the agent service account.
# The OLM bundle does not create these bindings (documented v2.0.0 gap):
# without them every AgenticRun fails with
# "no ClusterRoleBinding found with subject lightspeed-agent".
# --------------------------------

- name: Bind cluster-reader to the agent service account
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: lightspeed-agent-cluster-reader
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: cluster-reader
      subjects:
        - kind: ServiceAccount
          name: lightspeed-agent
          namespace: "{{ ocp5_workload_ols_namespace }}"

- name: Bind cluster-monitoring-view to the agent service account
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: lightspeed-agent-monitoring-view
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: cluster-monitoring-view
      subjects:
        - kind: ServiceAccount
          name: lightspeed-agent
          namespace: "{{ ocp5_workload_ols_namespace }}"

# --------------------------------
# Execution RBAC for the agentic operator.
# The analysis LLM proposes per-run sandbox RBAC dynamically, so a scoped
# ClusterRole fails whenever a run needs permissions outside the set. For
# Technology Preview the docs state cluster-admin is the only reliable
# option (same as the former quickstart deployment).
# --------------------------------

- name: Bind cluster-admin to the agentic operator service account
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: lightspeed-agentic-operator-cluster-admin
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: cluster-admin
      subjects:
        - kind: ServiceAccount
          name: lightspeed-agentic-operator-controller-manager
          namespace: "{{ ocp5_workload_ols_namespace }}"

# --------------------------------
# LLM credentials — provider API key for the agentic component.
# Secret name is provider-scoped (llm-creds-openai or llm-creds-maas).
# Completely independent from the classic OLS credential secrets.
# --------------------------------

- name: Create agentic LLM credentials secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ _ocp5_workload_ols_agentic_effective_creds_secret }}"
        namespace: "{{ ocp5_workload_ols_namespace }}"
      type: Opaque
      stringData:
        OPENAI_API_KEY: "{{ ocp5_workload_ols_agentic_api_key }}"
  no_log: true

# MaaS is an OpenAI-compatible proxy: the documented LLMProvider url
# override points the OpenAI provider type at the MaaS endpoint.
- name: Apply LLMProvider CR
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: agentic.openshift.io/v1alpha1
      kind: LLMProvider
      metadata:
        name: "{{ ocp5_workload_ols_agentic_provider }}"
      spec:
        type: OpenAI
        openAI: >-
          {{
            {'url': ocp5_workload_ols_agentic_maas_url,
             'credentialsSecret': {'name': _ocp5_workload_ols_agentic_effective_creds_secret}}
            if ocp5_workload_ols_agentic_provider == 'maas'
            else {'credentialsSecret': {'name': _ocp5_workload_ols_agentic_effective_creds_secret}}
          }}

- name: Apply Agent CR
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: agentic.openshift.io/v1alpha1
      kind: Agent
      metadata:
        name: default
      spec:
        llmProvider:
          name: "{{ ocp5_workload_ols_agentic_provider }}"
        model: "{{ _ocp5_workload_ols_agentic_effective_model }}"
        timeouts:
          analysisSeconds: 500
          executionSeconds: 500
          verificationSeconds: 500

- name: Apply smart Agent CR
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: agentic.openshift.io/v1alpha1
      kind: Agent
      metadata:
        name: smart
      spec:
        llmProvider:
          name: "{{ ocp5_workload_ols_agentic_provider }}"
        model: "{{ _ocp5_workload_ols_agentic_effective_model }}"
        timeouts:
          analysisSeconds: 500
          executionSeconds: 500
          verificationSeconds: 500

- name: Apply ApprovalPolicy CR
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: agentic.openshift.io/v1alpha1
      kind: ApprovalPolicy
      metadata:
        name: cluster
      spec:
        maxConcurrentRuns: 5
        stages:
          - name: Analysis
            approval: Manual
          - name: Execution
            approval: Manual
          - name: Verification
            approval: Automatic
          - name: Escalation
            approval: Automatic

# --------------------------------
# Alerts adapter — enabled through the OLSConfig
# (spec.ols.deployment.alertsAdapter.configMapRef, set in the OLSConfig
# templates). This ConfigMap is user-managed: it authorizes the adapter to
# process alerts routed to the critical receiver and points it at the
# troubleshooting skills used to investigate them.
# --------------------------------

- name: Create alerts-adapter-config ConfigMap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: alerts-adapter-config
        namespace: "{{ ocp5_workload_ols_namespace }}"
      data:
        config.yaml: |
          filtering:
            allowedReceivers:
            - critical
          tools:
            skills:
              - image: quay.io/openshiftanalytics/agentic-skills:latest
                paths:
                  - /skills/cluster-troubleshoot/investigate-alert

# --------------------------------
# Fauxinnati — fake update server
# --------------------------------

- name: Configure fauxinnati update graph
  when: ocp5_workload_ols_agentic_enable_cluster_updates | bool
  kubernetes.core.k8s_json_patch:
    api_version: config.openshift.io/v1
    kind: ClusterVersion
    name: version
    patch:
      - op: add
        path: /spec/upstream
        value: https://fauxinnati-fauxinnati.apps.ota-stage.q2z4.p1.openshiftapps.com/api/upgrades_info/graph
      - op: add
        path: /spec/channel
        value: simple

- name: Set user info for Agentic OLS
  agnosticd.core.agnosticd_user_info:
    msg: |
      Agentic OpenShift Lightspeed deployed successfully:
        - Namespace: {{ ocp5_workload_ols_namespace }}
        - Provider: {{ ocp5_workload_ols_agentic_provider }}
        - LLM endpoint: {{ ocp5_workload_ols_agentic_maas_url if ocp5_workload_ols_agentic_provider == 'maas' else 'https://api.openai.com' }}
        - Model: {{ _ocp5_workload_ols_agentic_effective_model }}
        - Alerts adapter: enabled via OLSConfig (critical receiver)
      Analysis and Execution stages require manual approval via AgenticRunApproval CR.
    data:
      agentic_ols_namespace: "{{ ocp5_workload_ols_namespace }}"
      agentic_model: "{{ _ocp5_workload_ols_agentic_effective_model }}"
