---
- name: Set Variables
  ansible.builtin.set_fact:
    _ocp5_workload_ols_namespace: "{{ ocp5_workload_ols_namespace }}"

- name: Install OpenShift LightSpeed Operator
  ansible.builtin.include_role:
    name: install_operator
  vars:
    install_operator_action: install
    install_operator_name: lightspeed-operator
    install_operator_namespace: "{{ _ocp5_workload_ols_namespace }}"
    install_operator_manage_namespaces: ["{{ _ocp5_workload_ols_namespace }}"]
    install_operator_channel: "{{ ocp5_workload_ols_channel }}"
    install_operator_catalog: redhat-operators
    install_operator_automatic_install_plan_approval: "{{ ocp5_workload_ols_automatic_install_plan_approval | default(true) }}"
    install_operator_csv_nameprefix: "{{ ocp5_workload_ols_csv_nameprefix }}"
    install_operator_starting_csv: "{{ ocp5_workload_ols_starting_csv }}"
